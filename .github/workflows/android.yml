name: Android

# Testet das core-Modul, baut das Debug-APK und veröffentlicht es als Vorab-Release:
#   main      → „android-latest“ (stabiler Kanal)
#   claude/** → „android-dev“    (Entwicklungsstand, z. B. offene PRs)
# Die App prüft beim Start ihren Kanal und bietet neuere Builds selbst zur Installation an.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPDATE_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'android-latest' || 'android-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test
      # ubuntu-latest bringt ein Android SDK mit (ANDROID_HOME ist gesetzt).
      # Keine Secrets im APK: Login und Client-Kennung kommen zur Laufzeit.
      # versionCode = Laufnummer, damit die App neuere Builds erkennt.
      - name: APK bauen
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crtv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release „${{ env.UPDATE_CHANNEL }}“ ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          cp app/build/outputs/apk/debug/app-debug.apk crtv.apk
          printf '{"versionCode":%s,"versionName":"0.1.0-%s","branch":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$SHORT" "$GITHUB_REF_NAME" > version.json
          gh release delete "$UPDATE_CHANNEL" --cleanup-tag --yes || true
          gh release create "$UPDATE_CHANNEL" crtv.apk version.json --prerelease --target "$GITHUB_SHA" \
            --title "Android TV Test-Build ${UPDATE_CHANNEL} (${SHORT})" \
            --notes "Debug-signierter Test-Build von \`${SHORT}\` (${GITHUB_REF_NAME}). Die App bietet ihn selbst als Update an."
