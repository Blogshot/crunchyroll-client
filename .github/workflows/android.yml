name: Android

# Testet das core-Modul, baut das Debug-APK und veröffentlicht es als Vorab-Release „android-latest“
# (fester Download-Link, wird bei jedem Lauf auf main ersetzt).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test
      # ubuntu-latest bringt ein Android SDK mit (ANDROID_HOME ist gesetzt).
      # Keine Secrets im APK: Login und Client-Kennung kommen zur Laufzeit.
      - name: APK bauen
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crtv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release „android-latest“ ersetzen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          cp app/build/outputs/apk/debug/app-debug.apk crtv-latest.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest crtv-latest.apk --prerelease \
            --title "Android TV Test-Build (${SHORT})" \
            --notes "Debug-signierter Test-Build von \`${SHORT}\`. Per ADB oder „Downloader“ auf dem Google TV installieren."
