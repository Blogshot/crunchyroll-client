name: API-Probe

# Manuell starten (Actions → API-Probe → Run workflow). Meldet sich mit dem Testkonto aus den Secrets an und prüft,
# ob die Endpunkte die erwartete Form haben. Ausgegeben werden nur Statuscodes und Feldnamen, keine Werte:
# Die Logs eines öffentlichen Repos sind öffentlich.
on:
  workflow_dispatch:
  # Zum Testen eines Branches vor dem Merge: auf probe/<name> pushen.
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        env:
          # Ursprünglich als CR_CLIENT_ID/CR_CLIENT_SECRET angelegt; CR_USERNAME/CR_PASSWORD haben Vorrang.
          CR_USERNAME: ${{ secrets.CR_USERNAME || secrets.CR_CLIENT_ID }}
          CR_PASSWORD: ${{ secrets.CR_PASSWORD || secrets.CR_CLIENT_SECRET }}
        run: set -o pipefail; ./gradlew -PcoreOnly :core:test --tests '*ApiProbe*' -i | grep -E '^\s*PROBE|FAILED|BUILD'
